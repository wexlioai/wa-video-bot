# Throwaway Evolution API v2.3.6 used only by `node scripts/test-lists.js` to check whether
# interactive list menus show on your phone. Own database and port (8081); your real bot is not touched.
name: wvb-liststest
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.6
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SERVER_URL: http://127.0.0.1:8081
      AUTHENTICATION_API_KEY: ${EVO_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: liststest
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
  redis:
    image: redis:7-alpine
