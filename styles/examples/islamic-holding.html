<!-- component: new | Ruling on a judgment document | holding-document | A numbered ruling settles onto a document over a girih pattern; key words underlined as spoken; seal and HELD stamp land as the payoff -->
<!-- meta: {"style":"court-archive","niche":"islamic"} -->
<style>
  .sc .bg { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 40%, #1F5C4A 0%, #123A2F 100%); }
  .sc .pat { position:absolute; inset:0; width:1920px; opacity:.18; }
  .sc .doc { position:absolute; left:290px; top:110px; width:1340px; filter:drop-shadow(0 30px 50px rgba(0,0,0,.35)); }
  .sc .kick { position:absolute; left:420px; top:220px; font:600 24px Inter, sans-serif; letter-spacing:9px; color:var(--accent); }
  .sc .num { position:absolute; left:410px; top:290px; font:700 150px/1 var(--fh); color:var(--accent); }
  .sc .ruling { position:absolute; left:560px; top:300px; width:900px; font:600 56px/1.3 var(--fh); color:#2A1D10; }
  .sc .ruling u { text-decoration:none; background:linear-gradient(transparent 62%, rgba(176,138,62,.45) 62%) no-repeat; background-size:0% 100%; }
  .sc .stamp { position:absolute; left:1300px; top:640px; width:220px; }
  .sc .seal { position:absolute; left:420px; top:700px; width:120px; }
  .portrait .sc .doc { left:40px; top:300px; width:1000px; } .portrait .sc .kick { left:200px; top:400px; }
  .portrait .sc .num { left:190px; top:460px; } .portrait .sc .ruling { left:330px; top:480px; width:560px; font-size:48px; }
  .portrait .sc .stamp { left:700px; top:1000px; } .portrait .sc .seal { left:200px; top:1060px; }
</style>
<div class="sc">
  <div class="bg"></div>
  <prop name="girih-pattern" class="pat"></prop>
  <prop name="document-wide" class="doc"></prop>
  <div class="kick">THE COURT HOLDS</div>
  <div class="num">2</div>
  <div class="ruling">Constitutional citizenship <u>transcends tribal and religious boundaries</u>, with equal rights for all.</div>
  <prop name="wax-seal" class="seal" text="3 AH"></prop>
  <prop name="stamp" class="stamp" text="HELD"></prop>
</div>
<script>
  // the document is already on the desk at frame 0 and settles from a slight angle
  tl.fromTo('.sc .doc', { y: 60, rotation: -2 }, { y: 0, rotation: 0, duration: 1.0 * E, ease: 'power3.out' }, 0);
  tl.fromTo('.sc .pat', { scale: 1.08 }, { scale: 1, duration: D, ease: 'none' }, 0);
  tl.from('.sc .kick', { opacity: 0, x: -30, duration: 0.5 * E, ease: 'power2.out' }, 0.2);
  tl.from('.sc .num', { opacity: 0, scale: 0.7, transformOrigin: '50% 60%', duration: 0.6 * E, ease: 'power3.out' }, 0.35);
  // the ruling rises line by line, then the key words are marked as they are spoken
  tl.from('.sc .ruling', { opacity: 0, y: 24, duration: 0.8 * E, ease: 'power3.out' }, 0.6);
  tl.to('.sc .ruling u', { backgroundSize: '100% 100%', duration: 0.9 * E, ease: 'power2.inOut' }, when('transcends', 1) - 0.1);
  // payoff: the seal, then the HELD stamp (the one punchy moment)
  tl.from('.sc .seal', { opacity: 0, scale: 1.4, transformOrigin: '50% 50%', duration: 0.35, ease: 'power3.out' }, Math.min(D - 2.2, when('equal', 2)));
  sfx('seal', Math.min(D - 2.2, when('equal', 2)) + 0.25);
  sfx('stamp', Math.min(D - 1.5, when('all', 3) + 0.2) + 0.22);
  tl.fromTo('.sc .stamp', { opacity: 0, scale: 1.6, rotation: -20, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, rotation: -12, duration: 0.25, ease: 'power4.in' }, Math.min(D - 1.5, when('all', 3) + 0.2));
  tl.to('.sc .doc', { y: 6, duration: 0.08, yoyo: true, repeat: 1, ease: 'power1.inOut' }, Math.min(D - 1.5, when('all', 3) + 0.45));
</script>
